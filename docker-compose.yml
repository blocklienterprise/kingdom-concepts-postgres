services:
  postgres:
    build:
      context: .
    image: kingdom-concepts-postgres:local
    container_name: kingdom-concepts-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_TLS_MODE: ${POSTGRES_TLS_MODE:-off}
    ports:
      - "5432:5432"
    volumes:
      - kingdom_concepts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kingdom_concepts_postgres_data:
